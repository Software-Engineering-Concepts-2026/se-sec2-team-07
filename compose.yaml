services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:?Set Supabase project ref}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:?Set Supabase runtime connection}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      HOST: 0.0.0.0
      PORT: 8000
      NODE_ENV: development
      COOKIE_SECURE: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_MODE: ${OPENAI_API_MODE:-}
    restart: unless-stopped
