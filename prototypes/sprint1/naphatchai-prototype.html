  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flashcards Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Section 1: Editor Panel -->
        <div class="editor-panel">
            <h2>Focus Flashcards</h2>
            <p class="subtitle">Customize your flashcard content and appearance</p>
            
            <form>
                <div class="form-group">
                    <label for="card-front">Front Side (Question / Term)</label>
                    <input type="text" id="card-front" placeholder="e.g., Photosynthesis" value="Photosynthesis">
                </div>

                <div class="form-group">
                    <label for="card-back">Back Side (Answer / Definition)</label>
                    <textarea id="card-back" rows="4" placeholder="e.g., Process used by plants to convert light energy into chemical energy">Process used by plants to convert light energy into chemical energy</textarea>
                </div>

                <div class="form-group">
                    <label for="card-color">Card Theme Color</label>
                    <input type="color" id="card-color" value="#6366f1">
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary">Clear Data</button>
                    <button type="submit" class="btn btn-primary">Save Card</button>
                </div>
            </form>
        </div>

        <!-- Section 2: Live Preview Panel -->
        <div class="preview-panel">
            <h3>Live Preview</h3>
            <p class="hint">Hover over the card to flip and see the back</p>
            
            <div class="flashcard-container">
                <div class="flashcard">
                    <!-- Front Face -->
                    <div class="card-face card-front">
                        <span class="card-label">FRONT</span>
                        <div class="card-text">Photosynthesis</div>
                    </div>
                    <!-- Back Face -->
                    <div class="card-face card-back">
                        <span class="card-label">BACK</span>
                        <div class="card-text">Process used by plants to convert light energy into chemical energy</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
