<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Flashcard - Upload</title>
    <link rel="stylesheet" href="./Nattapon_upload_style.css" />
  </head>
  <body>
    <main class="screen">
      <section class="content-card">
        <header class="header">
          <p class="brand">Focus Flashcard</p>
        </header>

        <h1 class="page-title">Upload</h1>

        <div class="upload-card">
          <input
            type="file"
            id="fileInput"
            accept=".pdf,.pptx,.txt"
            style="display: none"
          />
          <div class="upload-icon" aria-hidden="true">⬆</div>
          <p class="upload-title">Drag &amp; Drop your files here</p>
          <button type="button" class="browse-button">Browse Files</button>
          <p id="selectedFile" class="selected-file">No file selected</p>
          <p class="file-types">PDF, PPTX, TXT (Maximum 50MB)</p>
        </div>

        <form class="form-section">
          <label class="field">
            <span>Flashcard Set Name</span>
            <input type="text" placeholder="e.g. Biology Midterm Review" />
          </label>

          <label class="field">
            <span>Language</span>
            <select>
              <option value="">Select language</option>
              <option>Thai</option>
              <option>English</option>
              <option>Japanese</option>
            </select>
          </label>

          <label class="field">
            <span>Description (optional)</span>
            <textarea
              rows="3"
              placeholder="Add notes about this set..."
            ></textarea>
          </label>

          <label class="field">
            <span>Difficulty</span>
            <select>
              <option value="">Select difficulty</option>
              <option>Easy</option>
              <option>Medium</option>
              <option>Hard</option>
            </select>
          </label>
        </form>

        <button type="button" class="primary-button">สร้างแฟลชการ์ด</button>
      </section>
    </main>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('.form-section');
        const generateBtn = document.querySelector('.primary-button');
        const browseBtn = document.querySelector('.browse-button');
        const fileInput = document.getElementById('fileInput');
        const selectedFile = document.getElementById('selectedFile');
        const uploadCard = document.querySelector('.upload-card');

        // Open file picker when Browse Files is clicked
        browseBtn.addEventListener('click', function () {
          fileInput.click();
        });

        // Display selected file name
        fileInput.addEventListener('change', updateSelectedFile);

        // Display selected file name
        function updateSelectedFile() {
          if (fileInput.files.length > 0) {
            selectedFile.textContent = 'Selected: ' + fileInput.files[0].name;
          } else {
            selectedFile.textContent = 'No file selected';
          }
        }

        // Allow drag over upload area
        uploadCard.addEventListener('dragover', function (event) {
          event.preventDefault();
          uploadCard.style.borderColor = '#4A90E2';
        });

        // Restore upload area style
        uploadCard.addEventListener('dragleave', function () {
          uploadCard.style.borderColor = '';
        });

        // Handle dropped file
        uploadCard.addEventListener('drop', function (event) {
          event.preventDefault();

          uploadCard.style.borderColor = '';

          if (event.dataTransfer.files.length > 0) {
            fileInput.files = event.dataTransfer.files;

            updateSelectedFile();
          }
        });

        generateBtn.addEventListener('click', function (event) {
          // 1. Prevent default form submission
          event.preventDefault();

          // 2. Check if a file has been selected
          if (!fileInput.files.length) {
            alert('Please select a file.');
            return;
          }

          // Get form fields
          const setName = form.querySelector('input[type="text"]').value.trim();
          const selects = form.querySelectorAll('select');

          const language = selects[0].value;
          const difficulty = selects[1].value;

          // 3. Check required fields
          if (setName === '' || language === '' || difficulty === '') {
            alert('Please fill in all required fields.');
            return;
          }

          // 4. Validate file type
          const file = fileInput.files[0];
          const extension = file.name.split('.').pop().toLowerCase();

          const allowedExtensions = ['pdf', 'pptx', 'txt'];

          if (!allowedExtensions.includes(extension)) {
            alert('Only PDF, PPTX, and TXT files are allowed.');
            return;
          }

          // 5. Success
          alert('Flashcards are being generated... (Prototype)');
        });
      });
    </script>
  </body>
</html>
