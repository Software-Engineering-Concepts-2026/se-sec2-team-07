name: Safety Net CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/safety-net]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check src/review.py src/tests/test_review_safety_net.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest src/tests/test_review_safety_net.py -v --cov=src.review --cov-report=term-missing
